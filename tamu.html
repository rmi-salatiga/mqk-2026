<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekapitulasi Tamu - MQK Salatiga 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app-config.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" >Rekapitulasi Publik | MQK HSN PCNU Kota Salatiga 2026</a>
            <a href="index.html" class="btn btn-outline-light btn-sm">Pendaftaran</a>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card shadow border-success">
                    <div class="card-body">
                        <h6 class="text-muted">Total Seluruh Santri Terdaftar</h6>
                        <h3 class="fw-bold text-success" id="tamu-total-santri">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow border-primary">
                    <div class="card-body">
                        <h6 class="text-muted">Pondok Pesantren Berpartisipasi</h6>
                        <h3 class="fw-bold text-primary" id="tamu-total-pesantren">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 text-secondary">Daftar Resmi Santri Delegasi Terdaftar</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle">
                        <thead class="table-success text-center">
                            <tr>
                                <th>No</th>
                                <th>Asal Pondok Pesantren</th>
                                <th>Nama Santri</th>
                                <th>L/P</th>
                                <th>Cabang Kitab Lomba</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-tamu-body">
                            <!-- Dimuat via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const _supabase = createMqkSupabase();

        async function loadDataTamu() {
            const { data, error } = await _supabase
                .from('peserta')
                .select(`
                    *,
                    pesantren ( nama_pesantren )
                `);

            if (error) {
                document.getElementById('tabel-tamu-body').innerHTML = `<tr><td colspan="5" class="text-center text-danger">Gagal memuat data: ${error.message}</td></tr>`;
                return;
            }

            const tbody = document.getElementById('tabel-tamu-body');
            tbody.innerHTML = '';
            const peserta = data || [];
            document.getElementById('tamu-total-santri').innerText = peserta.length;

            const uniquePesantren = new Set(peserta.map(item => item.pesantren_id).filter(Boolean));
            document.getElementById('tamu-total-pesantren').innerText = uniquePesantren.size;

            if (peserta.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Belum ada data peserta.</td></tr>`;
                return;
            }

            peserta.forEach((item, index) => {
                let kitabBersih = (item.kategori_kitab || '-').replace(' [Tanpa Batas Usia]', '');
                tbody.innerHTML += `
                    <tr>
                        <td class="text-center">${index + 1}</td>
                        <td><b>${item.pesantren ? item.pesantren.nama_pesantren : '-'}</b></td>
                        <td>${item.nama_lengkap}</td>
                        <td class="text-center">${item.jenis_kelamin}</td>
                        <td>${kitabBersih}</td>
                    </tr>
                `;
            });
        }

        loadDataTamu();
    </script>
</body>
</html>
